<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=1" />
  <title>Local Whisper</title>
  <meta name="title" content="Local AI Chat - Offline-Capable Browser LLM Assistant">
  <meta name="description" content="Local In-Browser LLM inference for private, fast, and secure chat - no server required.">
  <meta name="keywords" content="local AI chat, offline AI assistant, browser LLM, in-browser inference, private AI chat, offline LLM, local language model">
  <style>
    /* ponytail: static skeleton so the widget paints instantly instead of a
       blank #root while the JS bundle downloads/parses. React's createRoot
       render() overwrites #root's children, so this needs no removal code.
       Light-mode only — matches the app's default theme (no dark mode support). */
    #root:empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100vh;
      margin: 0;
      background: #ffffff;
      color: #202020;
      font: 16px/24px -apple-system, system-ui, sans-serif;
    }
    #root:empty::before {
      content: "Loading chat assistant…";
      font-size: 14px;
      color: #6b7280;
      font-weight: 400;
    }
    #root:empty::after {
      content: "";
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: root-skeleton-spin 0.8s linear infinite;
    }
    @keyframes root-skeleton-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SW is prod-only (GitHub Pages caching + COEP). In dev it intercepts vite's
      // on-demand module/wasm requests (esp. under optimizeDeps.exclude) and breaks them.
      const isDev = ["localhost", "0.0.0.0", "127.0.0.1"].includes(location.hostname);
      if ("serviceWorker" in navigator && !isDev) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(console.error);
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
