<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wllama 3.5.1 createCompletion probe (standalone)</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; background: #111; color: #eee; padding: 1rem; white-space: pre-wrap; line-height: 1.5; }
    #log { font-size: 13px; }
    b { color: #6ee7b7; }
  </style>
</head>
<body>
  <h3>wllama 3.5.1 createCompletion probe</h3>
  <div id="log">booting… (CDN wllama + 19MB model, single-thread, ~10-30s)</div>
  <script type="module">
    // Standalone: NO vite, NO COEP, NO local files. wllama from CDN, tiny model
    // from HF. Answers one question: does createCompletion work on 3.5.1?
    // Open via any static server (e.g. VS Code Live Server) in any browser.
    const el = document.getElementById("log");
    const log = (m, bold) => {
      el.textContent += "\n" + m;
      console[bold ? "warn" : "log"](m);
    };

    try {
      log("importing wllama 3.5.1 from jsdelivr CDN…");
      const { Wllama } = await import("https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/index.js");
      log(`wllama imported: ${Wllama ? "ok" : "FAIL"}`);

      const w = new Wllama(
        { default: "https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/wasm/wllama.wasm" },
        { suppressNativeLog: true }
      );

      // tiny 19MB causal model — fast to download + complete. If createCompletion
      // works on this, it works on 3.5.1 generally (the GLUE error was model-independent).
      const MODEL = "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf";
      log("loading stories15M (19MB)…");
      const t0 = performance.now();
      await w.loadModelFromUrl(MODEL, { n_ctx: 512, n_batch: 512, n_ubatch: 512, n_threads: 1 });
      log(`model loaded in ${Math.round(performance.now() - t0)} ms`);

      log("running createCompletion…");
      const t1 = performance.now();
      const r = await w.createCompletion({ prompt: "Once upon a time", n_predict: 16, temperature: 0.5 });
      const txt = r?.choices?.[0]?.text || r?.content || JSON.stringify(r).slice(0, 200);
      log(`completion (${Math.round(performance.now() - t1)} ms): "${txt.slice(0, 120)}"`);
      log("\n✅ createCompletion WORKS on wllama 3.5.1.", true);
      log("→ The earlier failure was browser memory-fatigue. Proceed with the migration.");
    } catch (e) {
      log(`\n❌ ${e.name}: ${e.message}`, true);
      if (/Invalid typed array length|GLUE/i.test(e.message)) {
        log("→ createCompletion is genuinely broken on 3.5.1. Pick a fallback.");
      } else {
        log("→ different error (network/CORS?) — paste the message back.");
      }
      log((e.stack || "").split("\n").slice(0, 4).join("\n"));
    }
  </script>
</body>
</html>
